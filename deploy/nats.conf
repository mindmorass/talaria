# Talaria rendezvous queue — stock nats-server config for Machine B.
# B is NOT application code; it is this nats-server plus these streams/accounts.

server_name: talaria-b

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 5GB
}

# WebSocket is the ONLY intended client transport. TLS (wss://) is terminated by
# the existing reverse proxy in front of this server, which forwards the Upgrade
# here over the internal network. The native client port (4222) is deliberately
# left unmapped by docker-compose so it is never exposed publicly.
#
# To have nats-server terminate TLS itself instead of the proxy, set
# no_tls: false and add tls { cert_file, key_file } here.
websocket {
  port: 8443
  no_tls: true
  compression: true
}

# Least-privilege, per-role users in one account (both roles share the JOBS and
# RESPONSES streams, so they must live in the same account). Passwords come from
# the environment (set via compose); never hardcode them here.
#
# NOTE: "$JS.API.>" is broad (it grants the JetStream control API). For a single
# trusted operator in a lab this is acceptable; tightening to the specific
# $JS.API.CONSUMER / STREAM / direct-get subjects each role uses is a documented
# future hardening step, to be validated against a live server.
accounts {
  TALARIA: {
    jetstream: enabled
    users: [
      { user: "dispatcher", password: $TALARIA_DISPATCHER_PASS, permissions: {
          publish:   { allow: ["fetch.jobs", "$JS.API.>", "$JS.ACK.>"] }
          subscribe: { allow: ["fetch.responses.>", "_INBOX.>"] }
      }}
      { user: "runner", password: $TALARIA_RUNNER_PASS, permissions: {
          publish:   { allow: ["fetch.responses.>", "$JS.API.>", "$JS.ACK.>"] }
          subscribe: { allow: ["fetch.jobs", "_INBOX.>"] }
      }}
    ]
  }
}
