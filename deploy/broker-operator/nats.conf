# Multi-tenant broker (Machine B) — operator-mode nats-server.
# Auth is NATS decentralized JWT: the operator + per-tenant accounts live in
# tenants/preload.conf, generated by `talaria onboard --mint-nats --out tenants`.
# No static passwords here.

server_name: talaria-b

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 5GB
}

# WebSocket is the only intended client transport; TLS (wss://) is terminated by
# the existing reverse proxy, which forwards the Upgrade here. The native 4222
# port is not published by compose. To terminate TLS here instead, set
# no_tls: false and add tls { cert_file, key_file }.
websocket {
  port: 8443
  no_tls: true
  compression: true
}

# operator: + system_account: + resolver + resolver_preload{} for all tenants.
include "tenants/preload.conf"
